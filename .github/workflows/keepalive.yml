# =====================================================================
# Supabase keep-alive
# Repo path: .github/workflows/keepalive.yml
#
# WHY: Supabase free-tier projects pause after 7 days with no database
# activity. A paused project is unreachable, so participants would hit
# silent failures mid-study. This runs a real SELECT every 3 days.
#
# SETUP: Repo -> Settings -> Secrets and variables -> Actions -> New secret
#   SUPABASE_URL       e.g. https://abcdefgh.supabase.co
#   SUPABASE_ANON_KEY  the public anon key (safe here; RLS is the guard)
#
# IMPORTANT CAVEAT: GitHub disables scheduled workflows in repositories
# with no activity for ~60 days. If you leave the repo idle between the
# pilot and the main study, re-enable the workflow from the Actions tab
# (or just push a commit) before recruiting again.
# =====================================================================

name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 */3 * *'   # 06:00 UTC, every 3 days
  workflow_dispatch:         # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query heartbeat table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY secrets must be set."
            exit 1
          fi

          echo "Pinging ${SUPABASE_URL} ..."

          # Retry up to 3 times: a paused project can take ~30s to wake,
          # so the first attempt may time out even on success.
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -sS -o /tmp/response.txt -w '%{http_code}' \
              --max-time 60 \
              "${SUPABASE_URL}/rest/v1/heartbeat?select=id&limit=1" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Accept: application/json" || echo "000")

            echo "Attempt ${attempt}: HTTP ${HTTP_CODE}"
            cat /tmp/response.txt || true
            echo

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Keep-alive succeeded — project is awake."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 30s..."
              sleep 30
            fi
          done

          echo "::error::Keep-alive failed after 3 attempts (last HTTP ${HTTP_CODE})."
          echo "::error::Check that the project is not paused and that the heartbeat table + anon SELECT policy exist."
          exit 1
